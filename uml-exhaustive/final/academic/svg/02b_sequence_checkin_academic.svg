flow (code / QR)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="132.2549" x="5" y="162.8125">title Ticket Check-in</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="182.834" x="5" y="180.4219">skinparam shadowing false</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="3.8896" x="5" y="198.0313">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="220.999" x="5" y="215.6406">actor "Gate staff / Attendee" as A</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="161.8477" x="5" y="233.25">boundary "Web UI" as U</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="221.0264" x="5" y="250.8594">control "attendanceService" as S</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="173.5781" x="5" y="268.4688">database "Database" as D</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="3.8896" x="5" y="286.0781">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="243.1201" x="5" y="303.6875">A -&gt; U : scan QR or enter ticket code</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="213.5205" x="5" y="321.2969">U -&gt; S : findTicketByCode(code)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="65.3721" x="5" y="338.9063">activate S</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="342.3096" x="12.7793" y="356.5156">S -&gt; D : select ticket (by code) + registration(status)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="178.5068" x="12.7793" y="374.125">D --&gt; S : ticket row (or null)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="125.2139" x="12.7793" y="391.7344">alt ticket not found</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="215.8926" x="20.5586" y="409.3438">S --&gt; U : error "Ticket not found"</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="110.4688" x="12.7793" y="426.9531">else ticket found</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="163.8301" x="20.5586" y="444.5625">alt ticket.status = "used"</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="276.6572" x="28.3379" y="462.1719">S --&gt; U : error "Ticket already checked in"</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="119.0684" x="20.5586" y="479.7813">else ticket is valid</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="243.9336" x="28.3379" y="497.3906">alt registration.status != "confirmed"</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="419.7266" x="36.1172" y="515">S --&gt; U : error "Registration is not confirmed - cannot check in"</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="179.7168" x="28.3379" y="532.6094">else registration confirmed</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="262.6162" x="36.1172" y="550.2188">S -&gt; D : update ticket -&gt; status = "used"</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="73.5068" x="36.1172" y="567.8281">D --&gt; S : ok</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="342.7197" x="36.1172" y="585.4375">S -&gt; D : insert attendance (ticket_id, check_in_time)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="159.8584" x="36.1172" y="603.0469">D --&gt; S : attendance row</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="290.6094" x="36.1172" y="620.6563">S --&gt; U : success - attendee marked present</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="24.8896" x="28.3379" y="638.2656">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="24.8896" x="20.5586" y="655.875">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="24.8896" x="12.7793" y="673.4844">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="81.71" x="5" y="691.0938">deactivate S</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="3.8896" x="5" y="708.7031">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="80.8691" x="5" y="726.3125">note bottom</text><text fill="#33FF02" font-family=